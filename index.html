<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Record for Kati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,500;1,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#14070c; --wine:#2a0a14; --red:#d3202f; --gold:#c9a45c; --bone:#f0e6da;
  --size:min(80vw,52vh,470px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(65% 50% at 50% 38%, rgba(240,45,60,.5), transparent 72%),
    radial-gradient(120% 80% at 50% 120%, var(--wine), transparent 60%),
    var(--night);
  color:var(--bone); font-family:'DM Sans',system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(18px,4vh,36px); padding:16px; overflow-x:hidden; text-align:center;
}
.to{font-family:'Bodoni Moda',Georgia,serif; font-style:italic; font-size:clamp(20px,4.6vw,28px); color:var(--gold); margin:0; min-height:1.3em}
.deck{position:relative; width:var(--size); height:var(--size); margin-right:calc(var(--size)*.0)}
.glow{position:absolute; inset:-8%; border-radius:50%; background:radial-gradient(circle, rgba(240,50,65,.6), transparent 65%); opacity:.55; transition:opacity .8s}
.playing .glow{opacity:.9}
.record{
  display:block; position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%; cursor:pointer; -webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(circle, #000 0 4%, transparent 4.5%),
    repeating-radial-gradient(circle at 50% 50%, #0b0b0d 0 1.2px, #1a1a1e 1.6px 2.4px),
    #0b0b0d;
  box-shadow:0 30px 60px rgba(0,0,0,.65), 0 0 0 2px #050506;
  animation:spin 3.6s linear infinite; animation-play-state:paused;
}
.record::before{ /* light sheen */
  content:""; position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 20deg, transparent 0 8%, rgba(255,255,255,.16) 14%, transparent 22% 58%, rgba(255,255,255,.13) 64%, transparent 72%);
}
.record::after{ /* dead wax rings */
  content:""; position:absolute; inset:17%; border-radius:50%;
  box-shadow:0 0 0 2px rgba(0,0,0,.6), 0 0 0 5px rgba(255,255,255,.04);
}
.playing .record{animation-play-state:running}
.record:focus-visible{outline:3px solid var(--gold); outline-offset:6px}
.label{
  position:absolute; inset:34%; border-radius:50%;
  background:radial-gradient(circle at 50% 35%, #e8303f, var(--red) 55%, #8f1420);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--bone); box-shadow:inset 0 0 0 3px rgba(240,230,218,.18);
  z-index:1;
}
.label{overflow:hidden}
.label img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.3); transform-origin:62% 48%; display:block}
.label b{font-family:'Bodoni Moda',serif; font-style:italic; font-weight:700; font-size:calc(var(--size)*.05); line-height:1.05; text-align:center; max-width:90%}
.label span{font-size:calc(var(--size)*.032); letter-spacing:.04em; margin-top:.35em; opacity:.9}
.label i{position:absolute; width:calc(var(--size)*.035); height:calc(var(--size)*.035); border-radius:50%; background:var(--night); box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.arm{
  position:absolute; top:-3%; right:-14%; width:12%; height:78%;
  transform-origin:50% 8%; transform:rotate(-24deg); transition:transform 1.4s cubic-bezier(.6,.05,.3,1);
  pointer-events:none; z-index:3;
}
.playing .arm{transform:rotate(14deg)}
.arm .pivot{position:absolute; top:0; left:50%; width:100%; aspect-ratio:1; transform:translateX(-50%); border-radius:50%; background:radial-gradient(circle at 35% 30%, #d9d2c8, #6c665e); box-shadow:0 4px 10px rgba(0,0,0,.6)}
.arm .rod{position:absolute; top:10%; left:50%; width:14%; height:78%; transform:translateX(-50%); background:linear-gradient(90deg,#8a847b,#e7e0d6,#8a847b); border-radius:4px; box-shadow:0 6px 12px rgba(0,0,0,.45)}
.arm .head{position:absolute; bottom:0; left:50%; width:62%; height:13%; transform:translateX(-50%) rotate(-6deg); background:linear-gradient(#2a2a2e,#0e0e10); border-radius:3px 3px 8px 8px; border:1px solid #55504a}
.play{
  font:500 16px/1 'DM Sans',sans-serif; color:var(--night); background:var(--bone);
  display:inline-block; text-decoration:none; border:0; border-radius:999px; padding:14px 30px; cursor:pointer; transition:background .2s, transform .2s;
}
.play:hover{background:#fff} .play:active{transform:scale(.97)}
.play:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.meta h1{font-family:'Bodoni Moda',Georgia,serif; font-style:italic; font-weight:700; font-size:clamp(34px,9vw,58px); margin:0; line-height:1.05}
.meta p{margin:.5em auto 0; max-width:30ch; font-size:13px; line-height:1.45; color:rgba(240,230,218,.75)}
.meta .by{margin-top:.4em; font-size:18px; color:var(--gold)}
.meta small{display:block; margin-top:1.2em; color:var(--gold); font-size:15px}
.glow{animation:glowin 2.4s ease .6s backwards}
@keyframes glowin{from{opacity:0}}
.sleeve img{width:100%; height:100%; object-fit:cover; display:block}
.sleeve{overflow:hidden; position:absolute; inset:-2%; z-index:5; pointer-events:none; border-radius:8px; background:linear-gradient(145deg,#24090f,#0c0306); border:1px solid rgba(201,164,92,.4); box-shadow:0 20px 50px rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; font-family:'Bodoni Moda',serif; font-style:italic; color:var(--gold); font-size:calc(var(--size)*.07); animation:sleeve 1.8s cubic-bezier(.6,.05,.3,1) .6s forwards}
@keyframes sleeve{0%{transform:none; opacity:1} 100%{transform:translateY(60%); opacity:0; visibility:hidden}}
.play:not(.done){animation:pulse 2.2s ease-out 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,50,65,.6)} 70%{box-shadow:0 0 0 18px rgba(240,50,65,0)} 100%{box-shadow:0 0 0 0 rgba(240,50,65,0)}}
.eq{display:flex; align-items:center; justify-content:center; gap:10px; height:22px; margin-top:.9em; visibility:hidden; opacity:0; transition:opacity .6s}
.playing .eq{visibility:visible; opacity:1}
.eq .bars{display:flex; align-items:flex-end; gap:3px; height:16px}
.eq i{width:3px; height:100%; border-radius:2px; background:#f0283c; transform-origin:bottom; transform:scaleY(.3); animation:bar 1s ease-in-out infinite; animation-play-state:paused}
.playing .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-duration:.8s; animation-delay:-.3s}
.eq i:nth-child(3){animation-duration:1.15s; animation-delay:-.6s}
.eq i:nth-child(4){animation-duration:.9s; animation-delay:-.1s}
.eq i:nth-child(5){animation-duration:1.05s; animation-delay:-.5s}
.eq span{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold)}
@keyframes bar{0%,100%{transform:scaleY(.25)} 50%{transform:scaleY(1)}}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:9}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .record{animation-duration:12s} .arm{transition-duration:.01s} .sleeve{display:none} .glow,.play:not(.done),.eq i{animation:none} .eq i{transform:scaleY(.6)} }
</style>
</head>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var to = q.get('to'), from = q.get('from'), note = q.get('note');
  var toEl = document.getElementById('to');
  toEl.textContent = to ? 'For ' + to + ', a record picked just for you' : 'A record picked just for you';
  if (note) document.getElementById('note').textContent = note;
  if (from) document.getElementById('from').textContent = 'With love, ' + from;

  var deck = document.getElementById('deck'), btn = document.getElementById('play'), on = false;
  var ctx = null, noise = null, gain = null, go = null;

  function startCrackle(){
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      if (!noise){
        var len = ctx.sampleRate * 3, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
        for (var i = 0; i < len; i++){
          d[i] = (Math.random() * 2 - 1) * 0.015;
          if (Math.random() < 0.0006) d[i] = (Math.random() * 2 - 1) * 0.5;
        }
        noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
        var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
        gain = ctx.createGain(); gain.gain.value = 0;
        noise.connect(hp); hp.connect(gain); gain.connect(ctx.destination); noise.start();
      }
      gain.gain.cancelScheduledValues(ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 1.4);
    }catch(e){}
  }
  function stopCrackle(){
    try{ if (gain) { gain.gain.cancelScheduledValues(ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + .5); } }catch(e){}
  }
  function drop(){

    startCrackle(); confetti();

  var cv = document.getElementById('confetti'), cx = cv.getContext('2d'), raf = null, back = false;
  function confetti(){
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    cv.width = innerWidth; cv.height = innerHeight;
    var r = document.getElementById('record').getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height / 2;
    var cols = ['#f0283c', '#ff5a6a', '#c9a45c', '#f0e6da', '#ffd98a'], parts = [];
    for (var i = 0; i < 90; i++){
      var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
      parts.push({x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5, s: 4 + Math.random() * 5, c: cols[i % cols.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 0, circ: Math.random() < .35});
    }

    (function tick(){

      parts.forEach(function(p){

        if (p.life < 170 && p.y < cv.height + 20){
